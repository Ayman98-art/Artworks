<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>مِرآة | معرض اللوحات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#00e5ff;--violet:#b14bff;--ink:#04050d;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:#dff3ff;font-family:'Cairo',sans-serif;overflow-x:hidden}
#stars,.nebula,.grid{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{background:
  radial-gradient(circle at 18% 22%,rgba(177,75,255,.16),transparent 42%),
  radial-gradient(circle at 82% 68%,rgba(0,229,255,.13),transparent 45%),
  radial-gradient(circle at 50% 105%,rgba(255,45,149,.12),transparent 52%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.18) translateY(-25px)}}
.grid{background-image:
  linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 75%)}

.hero{position:relative;z-index:2;min-height:88vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:2rem}
.hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(2.6rem,9vw,7rem);font-weight:900;
  letter-spacing:.06em;background:linear-gradient(180deg,#fff,var(--neon) 45%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(0,229,255,.6));animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 55px rgba(177,75,255,.85))}}
.hero p{margin-top:1.4rem;font-size:clamp(.95rem,2.2vw,1.25rem);font-weight:200;
  letter-spacing:.32em;color:#8fd8ef}
.hero .line{width:1px;height:70px;margin-top:2.5rem;
  background:linear-gradient(var(--neon),transparent);animation:drop 2s ease-in-out infinite}
@keyframes drop{50%{opacity:.2;transform:scaleY(.6)}}

/* ===== الفلاتر ===== */
.filters{position:sticky;top:0;z-index:20;padding:1.1rem 1.5rem;
  background:rgba(4,5,13,.72);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,229,255,.14)}
.filters .inner{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.row .lbl{font-size:.72rem;letter-spacing:.22em;color:#6fa9c2;min-width:58px}
.chip{font-family:'Cairo';font-size:.8rem;padding:.42rem 1rem;border-radius:100px;cursor:pointer;
  color:#a9d3e4;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.2);
  transition:.28s;white-space:nowrap}
.chip:hover{border-color:rgba(0,229,255,.6);color:#fff}
.chip.on{background:linear-gradient(135deg,var(--neon),var(--violet));color:#04050d;
  font-weight:700;border-color:transparent;box-shadow:0 0 24px rgba(0,229,255,.5)}
.artist-row{max-height:2.6rem;overflow-x:auto;scrollbar-width:none}
.artist-row::-webkit-scrollbar{display:none}
.chip.sm{font-size:.74rem;padding:.34rem .85rem}
.count{font-size:.74rem;color:#6fa9c2;letter-spacing:.1em}

.gallery{position:relative;z-index:2;display:grid;gap:2rem;
  grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
  max-width:1320px;margin:0 auto;padding:2.5rem 2rem 9rem}
.card{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.01));
  border:1px solid rgba(0,229,255,.18);backdrop-filter:blur(14px);
  opacity:0;translate:0 40px;
  transition:opacity .6s,translate .6s,box-shadow .5s,border-color .5s}
.card.in{opacity:1;translate:0 0}
.card:hover{border-color:rgba(0,229,255,.75);
  box-shadow:0 0 40px rgba(0,229,255,.35),0 0 90px rgba(177,75,255,.22)}
.card .thumb{position:relative;aspect-ratio:4/5;overflow:hidden;background:#080b16}
.card img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .6s;
  filter:saturate(.75) contrast(1.1) brightness(.85)}
.card:hover img{transform:scale(1.09);filter:saturate(1.2) contrast(1.15) brightness(1)}
.card .thumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 35%,rgba(4,5,13,.92))}
.card .num{position:absolute;top:14px;left:16px;font-family:'Orbitron';font-size:.72rem;
  letter-spacing:.2em;color:var(--neon);opacity:.8;z-index:2}
.card .era{position:absolute;top:14px;right:16px;z-index:2;font-size:.66rem;
  padding:.22rem .6rem;border-radius:100px;background:rgba(4,5,13,.6);
  border:1px solid rgba(0,229,255,.35);color:#9fe6f7}
.card .info{position:absolute;bottom:0;right:0;left:0;padding:1.4rem;z-index:2}
.card h3{font-size:1.15rem;font-weight:700;margin-bottom:.35rem}
.card .artist{font-size:.82rem;color:var(--neon);letter-spacing:.08em}

.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:#6fa9c2;
  font-size:1rem;letter-spacing:.1em}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1.5rem;
  background:rgba(2,3,10,.9);backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transition:.4s}
.modal.open{opacity:1;visibility:visible}
.modal .box{display:grid;grid-template-columns:1fr 1fr;max-width:1000px;width:100%;
  max-height:88vh;overflow:auto;border-radius:24px;
  border:1px solid rgba(0,229,255,.35);
  box-shadow:0 0 80px rgba(0,229,255,.25),0 0 140px rgba(177,75,255,.18);
  transform:scale(.92);transition:.45s cubic-bezier(.2,.8,.2,1)}
.modal.open .box{transform:scale(1)}
.modal img{width:100%;height:100%;object-fit:cover;min-height:340px}
.modal .txt{padding:2.4rem;background:linear-gradient(160deg,#0a0f1e,#06070f)}
.modal h2{font-size:1.8rem;margin-bottom:.5rem}
.modal .m-artist{color:var(--neon);letter-spacing:.12em;font-size:.85rem;margin-bottom:1.6rem}
.modal p{line-height:2;font-weight:300;color:#b9d8e8;font-size:.95rem}
.close{position:absolute;top:22px;left:26px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;font-size:1.4rem;color:#fff;
  border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.08);transition:.3s}
.close:hover{background:var(--neon);color:#000;transform:rotate(90deg)}
@media(max-width:760px){.modal .box{grid-template-columns:1fr}.modal img{min-height:260px}
  .modal .txt{padding:1.6rem}.row .lbl{display:none}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="grid"></div>

<header class="hero">
  <h1 id="siteName">مِرآة</h1>
  <p>معرض اللوحات · خارج الزمن</p>
  <div class="line"></div>
</header>

<section class="filters">
  <div class="inner">
    <div class="row">
      <span class="lbl">العصر</span>
      <div class="row" id="eraRow"></div>
    </div>
    <div class="row">
      <span class="lbl">الفنان</span>
      <div class="row artist-row" id="artistRow"></div>
    </div>
    <div class="count" id="count"></div>
  </div>
</section>

<main class="gallery" id="gallery"></main>

<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">✕</div>
  <div class="box">
    <img id="mImg" alt="">
    <div class="txt">
      <h2 id="mTitle"></h2>
      <div class="m-artist" id="mArtist"></div>
      <p id="mDesc"></p>
    </div>
  </div>
</div>

<script>
/* ================= بيانات اللوحات — عدّل هنا ================= */
const arts = [
  { title:"الموناليزا", artist:"ليوناردو دافنشي", year:1503, era:"عصر النهضة", wiki:"Mona_Lisa",
    desc:"ابتسامة غامضة تحمل ألف تفسير. كل من ينظر إليها يرى شيئًا مختلفًا، ولهذا بقيت أشهر لوحة في التاريخ." },

  { title:"ميلاد فينوس", artist:"بوتيتشيلي", year:1485, era:"عصر النهضة", wiki:"The_Birth_of_Venus",
    desc:"إلهة تخرج من البحر على صدفة. أنقى تصوير للجمال في عصر النهضة الإيطالي." },

  { title:"الفتاة ذات القرط اللؤلؤي", artist:"فيرمير", year:1665, era:"الباروك", wiki:"Girl_with_a_Pearl_Earring",
    desc:"نظرة تستدير نحوك في لحظة أبدية. الضوء على القرط هو بطل اللوحة الحقيقي." },

  { title:"الدورية الليلية", artist:"رامبرانت", year:1642, era:"الباروك", wiki:"The_Night_Watch",
    desc:"ضوء يقطع الظلام ليصنع مسرحًا حيًا. رامبرانت جعل الجماعة كلها أبطالًا لا شخصًا واحدًا." },

  { title:"الحرية تقود الشعب", artist:"ديلاكروا", year:1830, era:"الرومانسية", wiki:"Liberty_Leading_the_People",
    desc:"الحرية امرأة تتقدم الصفوف. السياسة تحوّلت إلى أسطورة بصرية." },

  { title:"الموجة العظيمة", artist:"هوكوساي", year:1831, era:"أوكييو-إي", wiki:"The_Great_Wave_off_Kanagawa",
    desc:"الطبيعة تغضب، والبشر صغار أمامها. موجة واحدة تحمل هيبة البحر كله." },

  { title:"الليلة المرصعة بالنجوم", artist:"فان جوخ", year:1889, era:"ما بعد الانطباعية", wiki:"The_Starry_Night",
    desc:"سماء تدور كأنها نهر من الضوء. رسمها فان جوخ من نافذة مصحته، فحوّل الألم إلى دوامة من الجمال." },

  { title:"الصرخة", artist:"إدفارد مونك", year:1893, era:"التعبيرية", wiki:"The_Scream",
    desc:"وجه يذوب في موجات من القلق. أول لوحة تصوّر الرعب النفسي كأنه منظر طبيعي." },

  { title:"القُبلة", artist:"جوستاف كليمت", year:1908, era:"الفن الجديد", wiki:"The_Kiss_(Klimt)",
    desc:"جسدين يتحولان إلى ذهب وزخرفة. الحب هنا ليس مشهدًا، بل نسيجًا من ضوء." },

  { title:"ثبات الذاكرة", artist:"سلفادور دالي", year:1931, era:"السريالية", wiki:"The_Persistence_of_Memory",
    desc:"ساعات تذوب كالجبن. الزمن هنا ليس قياسًا، بل إحساس ينثني ويتساقط." },

  { title:"صقور الليل", artist:"إدوارد هوبر", year:1942, era:"الواقعية الأمريكية", wiki:"Nighthawks",
    desc:"مقهى مضيء وسط مدينة فارغة. العزلة في المدينة الكبيرة، مرسومة في ليلة واحدة أبدية." },

  { title:"قوطية أمريكية", artist:"جرانت وود", year:1930, era:"الواقعية الأمريكية", wiki:"American_Gothic",
    desc:"وجهان جامدان أمام منزل خشبي. صورة ساخرة ولطيفة للريف الأمريكي في زمن الكساد." }
];

/* ============ جلب الصور من ويكيبيديا ============ */
const cache = {};
async function wikiImg(t){
  if(cache[t]!==undefined) return cache[t];
  try{
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${t}`);
    const j = await r.json();
    cache[t] = (j.originalimage && j.originalimage.source)
            || (j.thumbnail && j.thumbnail.source) || "";
  }catch(e){ cache[t]=""; }
  return cache[t];
}

/* ============ بناء الكروت ============ */
const gallery = document.getElementById('gallery');
const cards = [];
arts.forEach((a,i)=>{
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = `
    <div class="thumb">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="era">${a.era}</span>
      <img alt="${a.title}" loading="lazy">
      <div class="info">
        <h3>${a.title}</h3>
        <div class="artist">${a.artist} · ${a.year}</div>
      </div>
    </div>`;
  const img = el.querySelector('img');
  img.src = `https://picsum.photos/seed/art${i}/800/1000`;
  wikiImg(a.wiki).then(src=>{ if(src) img.src = src; });
  el.onclick = ()=> openModal(a, img.src);
  gallery.appendChild(el);
  cards.push({el,a});
});

/* ============ الفلاتر ============ */
const state = { era:'all', artist:'all' };
const eraRow = document.getElementById('eraRow');
const artistRow = document.getElementById('artistRow');
const countEl = document.getElementById('count');

const eras = [...new Set(arts.map(a=>a.era))];
const artists = [...new Set(arts.map(a=>a.artist))];

function makeChip(text, val, group, small){
  const c = document.createElement('button');
  c.className = 'chip' + (small?' sm':'');
  c.textContent = text;
  c.dataset.val = val;
  c.onclick = ()=>{ state[group] = val; syncChips(group); apply(); };
  return c;
}

eraRow.appendChild(makeChip('الكل','all','era'));
eras.forEach(e=> eraRow.appendChild(makeChip(e,e,'era')));

artistRow.appendChild(makeChip('الكل','all','artist',true));
artists.forEach(n=> artistRow.appendChild(makeChip(n,n,'artist',true)));

function syncChips(group){
  const row = group==='era' ? eraRow : artistRow;
  row.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on', c.dataset.val === state[group]);
  });
}
syncChips('era'); syncChips('artist');

function apply(){
  let shown = 0;
  cards.forEach(({el,a})=>{
    const ok = (state.era==='all' || a.era===state.era)
            && (state.artist==='all' || a.artist===state.artist);
    el.style.display = ok ? '' : 'none';
    if(ok){
      el.classList.remove('in');
      el.style.transitionDelay = (shown%3)*.08 + 's';
      requestAnimationFrame(()=> el.classList.add('in'));
      shown++;
    }
  });
  countEl.textContent = `${shown} لوحة معروضة`;
  let empty = gallery.querySelector('.empty');
  if(shown===0 && !empty){
    empty = document.createElement('div');
    empty.className='empty';
    empty.textContent='لا توجد لوحات مطابقة لهذا الاختيار';
    gallery.appendChild(empty);
  } else if(shown>0 && empty){ empty.remove(); }
}
apply();

/* ============ المودال ============ */
const modal=document.getElementById('modal');
function openModal(a,src){
  document.getElementById('mImg').src=src;
  document.getElementById('mTitle').textContent=a.title;
  document.getElementById('mArtist').textContent=`${a.artist} · ${a.year} · ${a.era}`;
  document.getElementById('mDesc').textContent=a.desc;
  modal.classList.add('open');
}
function closeModal(){modal.classList.remove('open')}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ============ نجوم متحركة ============ */
const cvs=document.getElementById('stars'),ctx=cvs.getContext('2d');
let W,H,stars=[];
function resize(){
  W=cvs.width=innerWidth; H=cvs.height=innerHeight;
  stars=Array.from({length:Math.min(280,Math.floor(W*H/9000))},()=>({
    x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.2,
    s:Math.random()*.35+.05,a:Math.random()*6
  }));
}
addEventListener('resize',resize); resize();
(function loop(){
  ctx.clearRect(0,0,W,H);
  for(const st of stars){
    st.y-=st.s; if(st.y<0){st.y=H; st.x=Math.random()*W}
    st.a+=.02;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7);
    ctx.fillStyle=`rgba(180,235,255,${.3+Math.sin(st.a)*.35})`; ctx.fill();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
