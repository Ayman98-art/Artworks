<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

                <button class="chip" onclick="filterCards('era', 'بوب آرت', this)">بوب آرت</button>
            </div>
        </div>

            <span class="filter-label">الفنان</span>

            </div>

    <div class="counter" id="counter">جاري التحميل...</div>

    <!-- الفلاتر هتترسم هنا بالجافاسكريبت -->
    <div class="gallery" id="gallery"></div>

    <button id="scrollTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <div id="modal" class="modal" onclick="if(event.target.id === 'modal') closeModal()">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <img id="mImg" src="" alt="">
            <div class="modal-text">
                <h2 id="mTitle" class="modal-title"></h2>
                <p id="mArtist" class="modal-artist"></p>
                <p id="mDesc" class="modal-desc"></p>
            </div>
        </div>
    </div>

    <div class="footer">MIRROR · ARCHIVE v7.0</div>

    <script src="app.js"></script>
