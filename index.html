<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>مِرآة | أرشيف اللوحات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --neon:#00e5ff; --violet:#b14bff; --ink:#04050d;
    --line:rgba(0,229,255,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--ink); color: #dff3ff; font-family: 'Cairo', sans-serif; overflow-x: hidden; }

/* شاشة البداية */
.hero { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
.title { font-family: 'Orbitron'; font-size: clamp(3rem, 10vw, 7rem); font-weight: 900; background: linear-gradient(180deg, #fff, var(--neon), var(--violet)); -webkit-background-clip: text; color: transparent; }
.subtitle { margin-top: 1.5rem; letter-spacing: 0.3em; color: #8fd8ef; font-size: 1rem; }

/* الفلاتر */
.filters { position: sticky; top: 0; background: rgba(4,5,13,0.95); backdrop-filter: blur(10px); padding: 1rem; border-bottom: 1px solid var(--line); z-index: 10; }
.filter-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.filter-label { color: var(--neon); font-size: 0.85rem; font-family: 'Orbitron'; min-width: 50px;}
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: #a9d3e4; cursor: pointer; white-space: nowrap; font-family: 'Cairo'; font-size: 0.85rem; transition: 0.2s; }
.chip:hover { border-color: var(--neon); color: #fff; }
.chip.active { background: var(--neon); color: #000; font-weight: bold; border-color: var(--neon); box-shadow: 0 0 15px rgba(0,229,255,0.4); }

/* المعرض */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; }
.card { background: #080b16; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.3s; }
.card:hover { border-color: var(--neon); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.card img { width: 100%; height: 320px; object-fit: cover; display: block; }
.card-info { padding: 15px; }
.card-title { font-size: 1.1rem; margin-bottom: 5px; font-weight: 700; }
.card-artist { color: var(--neon); font-size: 0.8rem; }

/* المودال (النافذة المنبثقة) */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(5px); }
.modal.open { display: flex; }
.modal-content { background: #0a0f1e; border: 1px solid var(--neon); border-radius: 15px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 0 50px rgba(0,229,255,0.2); }
.modal-content img { width: 100%; max-height: 50vh; object-fit: contain; background: #000; }
.modal-text { padding: 25px; }
.close-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid var(--neon); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.close-btn:hover { background: var(--neon); color: #000; }

.footer { text-align: center; padding: 2rem; border-top: 1px solid var(--line); color: #6fa9c2; font-size: 0.8rem; font-family: 'Orbitron'; }
</style>
</head>
<body>

<div class="hero">
    <h1 class="title">مِرآة</h1>
    <p class="subtitle">أرشيف اللوحات · خارج الزمن</p>
</div>

<div class="filters">
    <div class="filter-group">
        <span class="filter-label">العصر</span>
        <div id="eraFilters" class="filter-row"></div>
    </div>
    <div class="filter-group">
        <span class="filter-label">الفنان</span>
        <div id="artistFilters" class="filter-row"></div>
    </div>
</div>

<div id="gallery" class="gallery"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <img id="mImg" src="" alt="">
        <div class="modal-text">
            <h2 id="mTitle" style="margin-bottom: 10px;"></h2>
            <p id="mArtist" style="color: var(--neon); margin-bottom: 15px; font-size: 0.9rem;"></p>
            <p id="mDesc" style="line-height: 1.8; color: #b9d8e8;"></p>
        </div>
    </div>
</div>

<div class="footer">MIRROR · ARCHIVE v3.0</div>

<script>
// البيانات
const arts = [
  { title:"الموناليزا", artist:"ليوناردو دافنشي", year:1503, era:"عصر النهضة", wiki:"Mona_Lisa", desc:"ابتسامة غامضة تتحدى التفسير. كل من ينظر إليها يرى شيئًا مختلفًا." },
  { title:"ميلاد فينوس", artist:"بوتيتشيلي", year:1485, era:"عصر النهضة", wiki:"The_Birth_of_Venus", desc:"إلهة تخرج من زبد البحر على صدفة. أنقى تصوير للجمال." },
  { title:"العشاء الأخير", artist:"ليوناردو دافنشي", year:1498, era:"عصر النهضة", wiki:"The_Last_Supper_(Leonardo)", desc:"لحظة إعلان الخيانة، يتجمد الزمن حول مائدة واحدة." },
  { title:"خلق آدم", artist:"مايكل أنجلو", year:1512, era:"عصر النهضة", wiki:"The_Creation_of_Adam", desc:"إصبعان يتقاربان ولا يتلامسان. المسافة بينهما هي سر الحياة." },
  { title:"مدرسة أثينا", artist:"رافائيل", year:1511, era:"عصر النهضة", wiki:"The_School_of_Athens", desc:"كل فلاسفة اليونان في قاعة واحدة." },
  { title:"حديقة الملذات الأرضية", artist:"هيرونيموس بوش", year:1510, era:"عصر النهضة", wiki:"The_Garden_of_Earthly_Delights", desc:"ثلاثية من الجنة إلى الجحيم، حالمة وغريبة." },
  { title:"برج بابل", artist:"بيتر بروغل", year:1563, era:"عصر النهضة", wiki:"The_Tower_of_Babel_(Bruegel)", desc:"برج يخترق السحاب، غرور البشر مرسوم بدقة." },
  { title:"الدورية الليلية", artist:"رامبرانت", year:1642, era:"الباروك", wiki:"The_Night_Watch", desc:"ضوء يقطع الظلام ليصنع مسرحًا حيًا." },
  { title:"وصيفات الشرف", artist:"دييغو فيلاسكيز", year:1656, era:"الباروك", wiki:"Las_Meninas", desc:"اللوحة تنظر إلى نفسها. الواقع يترنح." },
  { title:"الفتاة ذات القرط اللؤلؤي", artist:"يوهانس فيرمير", year:1665, era:"الباروك", wiki:"Girl_with_a_Pearl_Earring", desc:"نظرة تستدير نحوك في لحظة أبدية." },
  { title:"الحرية تقود الشعب", artist:"أوجين ديلاكروا", year:1830, era:"الرومانسية", wiki:"Liberty_Leading_the_People", desc:"الحرية امرأة تتقدم الصفوف. أسطورة بصرية." },
  { title:"طوف الميدوزا", artist:"تيودور جيريكو", year:1819, era:"الرومانسية", wiki:"The_Raft_of_the_Medusa", desc:"غرقى يتصارعون على طوف. صورة مروعة للبقاء." },
  { title:"المتجول فوق بحر الضباب", artist:"كاسبار ديفيد فريدريش", year:1818, era:"الرومانسية", wiki:"Wanderer_above_the_Sea_of_Fog", desc:"رجل يحدق في بحر من الضباب." },
  { title:"الثالث من مايو 1808", artist:"فرانسيسكو جويا", year:1814, era:"الرومانسية", wiki:"The_Third_of_May_1808", desc:"الظلام يبتلع ضوءًا واحدًا. جويا يرسم الجريمة." },
  { title:"الموجة العظيمة", artist:"هوكوساي", year:1831, era:"أوكييو-إي", wiki:"The_Great_Wave_off_Kanagawa", desc:"الطبيعة تغضب، والبشر صغار أمامها." },
  { title:"أوفيليا", artist:"جون إيفريت ميليه", year:1852, era:"ما قبل رافائيل", wiki:"Ophelia_(painting)", desc:"تغرق بين الزهور وهي تغني. استسلام شاعري." },
  { title:"والدة ويستلر", artist:"جيمس ويستلر", year:1871, era:"الواقعية", wiki:"Whistler's_Mother", desc:"امرأة تجلس في صمت. هدوء لا ينتهي." },
  { title:"انطباع، شروق الشمس", artist:"كلود مونيه", year:1872, era:"الانطباعية", wiki:"Impression,_Sunrise", desc:"اللوحة التي أعطت اسمًا لحركة فنية كاملة." },
  { title:"صف الحصة", artist:"إدغار ديجا", year:1874, era:"الانطباعية", wiki:"The_Dance_Class_(Degas)", desc:"فتيات ينتظرن إشارة المعلم. لحظة ترقب." },
  { title:"غداء على متن قارب", artist:"بيير أوغوست رينوار", year:1881, era:"الانطباعية", wiki:"Luncheon_of_the_Boating_Party", desc:"شرفة على النهر وضحكات تتردد." },
  { title:"أحد على جزيرة لا غراند جات", artist:"جورج سورا", year:1884, era:"التنقيطية", wiki:"A_Sunday_on_La_Grande_Jatte", desc:"آلاف النقاط تتجمع لتشكّل عالمًا هادئًا." },
  { title:"الليلة المرصعة بالنجوم", artist:"فان جوخ", year:1889, era:"ما بعد الانطباعية", wiki:"The_Starry_Night", desc:"سماء تدور كأنها نهر من الضوء. فان جوخ يحول الألم لجمال." },
  { title:"مقهى ليلي", artist:"فان جوخ", year:1888, era:"ما بعد الانطباعية", wiki:"Café_Terrace_at_Night", desc:"مقهى يتوهج في ليلة زرقاء." },
  { title:"الصرخة", artist:"إدفارد مونك", year:1893, era:"التعبيرية", wiki:"The_Scream", desc:"وجه يذوب في موجات من القلق." },
  { title:"القُبلة", artist:"جوستاف كليمت", year:1908, era:"الفن الجديد", wiki:"The_Kiss_(Klimt)", desc:"جسدين يتحولان إلى ذهب وزخرفة." },
  { title:"ثبات الذاكرة", artist:"سلفادور دالي", year:1931, era:"السريالية", wiki:"The_Persistence_of_Memory", desc:"ساعات تذوب كالجبن. الزمن إحساس." },
  { title:"غيرنيكا", artist:"بابلو بيكاسو", year:1937, era:"التكعيبية", wiki:"Guernica_(Picasso)", desc:"مدينة مقطعة إلى آلاف الأشلاء. بيكاسو يرسم الحرب." },
  { title:"الفريدتان", artist:"فريدا كاهلو", year:1939, era:"السريالية", wiki:"The_Two_Fridas", desc:"قلبان مكشوفان وأيدٍ متشابكة." },
  { title:"صقور الليل", artist:"إدوارد هوبر", year:1942, era:"الواقعية الأمريكية", wiki:"Nighthawks", desc:"مقهى مضيء وسط مدينة فارغة. العزلة." },
  { title:"قوطية أمريكية", artist:"جرانت وود", year:1930, era:"الواقعية الأمريكية", wiki:"American_Gothic", desc:"وجهان جامدان أمام منزل خشبي." },
  { title:"ابن الإنسان", artist:"رينيه ماغريت", year:1964, era:"السريالية", wiki:"The_Son_of_Man", desc:"تفاحة تخفي وجهًا. ما الذي نخفيه؟" },
  { title:"علب حساء كامبل", artist:"آندي وارهول", year:1962, era:"بوب آرت", wiki:"Campbell's_Soup_Cans", desc:"علب حساء على رف. الاستهلاك كأيقونة." }
];

let currentEra = 'all';
let currentArtist = 'all';

const gallery = document.getElementById('gallery');
const eraFilters = document.getElementById('eraFilters');
const artistFilters = document.getElementById('artistFilters');

// رسم المعرض
function renderGallery() {
    gallery.innerHTML = '';
    let count = 0;
    
    arts.forEach((art, index) => {
        if ((currentEra === 'all' || art.era === currentEra) && 
            (currentArtist === 'all' || art.artist === currentArtist)) {
            
            count++;
            const card = document.createElement('div');
            card.className = 'card';
            
            // صورة مؤقتة تظهر فوراً
            card.innerHTML = `
                <img src="https://picsum.photos/seed/art${index}/400/500" alt="${art.title}" loading="lazy">
                <div class="card-info">
                    <h3 class="card-title">${art.title}</h3>
                    <p class="card-artist">${art.artist} · ${art.year}</p>
                </div>
            `;
            
            card.onclick = () => openModal(art, index);
            gallery.appendChild(card);
            
            // محاولة جلب صورة اللوحة الحقيقية في الخلفية
            fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${art.wiki}`)
                .then(res => res.json())
                .then(data => {
                    if (data.originalimage && data.originalimage.source) {
                        card.querySelector('img').src = data.originalimage.source;
                    } else if (data.thumbnail && data.thumbnail.source) {
                        card.querySelector('img').src = data.thumbnail.source;
                    }
                })
                .catch(() => {}); 
        }
    });
    
    if (count === 0) {
        gallery.innerHTML = '<p style="text-align:center; width:100%; color:#6fa9c2; grid-column: 1/-1;">لا توجد لوحات مطابقة</p>';
    }
}

// رسم الفلاتر
function renderFilters() {
    const eras = ['all', ...new Set(arts.map(a => a.era))];
    const artists = ['all', ...new Set(arts.map(a => a.artist))];
    
    eraFilters.innerHTML = eras.map(e => 
        `<button class="chip ${currentEra === e ? 'active' : ''}" onclick="setEra('${e}')">${e === 'all' ? 'كل العصور' : e}</button>`
    ).join('');
    
    artistFilters.innerHTML = artists.map(a => 
        `<button class="chip ${currentArtist === a ? 'active' : ''}" onclick="setArtist('${a}')">${a === 'all' ? 'كل الفنانين' : a}</button>`
    ).join('');
}

window.setEra = (era) => { currentEra = era; renderFilters(); renderGallery(); };
window.setArtist = (artist) => { currentArtist = artist; renderFilters(); renderGallery(); };

// المودال
window.openModal = (art, index) => {
    document.getElementById('mImg').src = `https://picsum.photos/seed/art${index}/800/600`;
    document.getElementById('mTitle').textContent = art.title;
    document.getElementById('mArtist').textContent = `${art.artist} · ${art.year} · ${art.era}`;
    document.getElementById('mDesc').textContent = art.desc;
    
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${art.wiki}`)
        .then(res => res.json())
        .then(data => {
            if (data.originalimage && data.originalimage.source) {
                document.getElementById('mImg').src = data.originalimage.source;
            }
        })
        .catch(() => {});
        
    document.getElementById('modal').classList.add('open');
};

window.closeModal = () => {
    document.getElementById('modal').classList.remove('open');
};

// بدء التشغيل
renderFilters();
renderGallery();
</script>
</body>
</html>
